# cargo-deny 配置：许可证白名单 + 重复版本容忍 + 安全漏洞交给 cargo-audit（CI 已有）。
# 运行：cargo deny --workspace check licenses bans sources

[graph]
# 与 Cargo.lock 一致；targets 只检查桌面目标。
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = false

[licenses]
# 项目为 MIT；传递依赖只允许宽松许可证（GPL/AGPL 系一律拒绝——
# pluely 参考项目是 GPL-3.0，仅借鉴思路不复用代码，仓库要守住这条线）。
version = 2
# ring 例外见 [licenses.exceptions]；ring 本体是 ISC+OpenSSL 双许可，
# OpenSSL 部分 tauri 生态普遍放行。
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # jpeg-encoder（capture 模块的区域截图编码）许可证是 (MIT OR Apache-2.0) AND IJG。
  # IJG 是 Independent JPEG Group 的宽松许可：允许使用/修改/分发，只要求在文档里
  # 保留出处声明，不是 copyleft，与本仓「只收宽松许可」的口径一致。
  "IJG",
]
# 说明例外：括号里的包逐个声明理由。
exceptions = [
  # libbz2-rs-sys（zip → sherpa-onnx-sys 链路）：bzip2 1.0.6 是类 BSD 的宽松许可，
  # SPDX id "bzip2-1.0.6"，rust 生态标准做法是显式放行。
  { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]

[bans]
# 重复版本：**已知可接受的重复显式登记，新出现的重复就会立刻暴露**。
#
# 为什么不全量去重：这些重复来自 tauri / sherpa-onnx / pdf-extract 生态内部，
# 它们各自钉着不同的大版本（aes 0.8 vs 0.9、digest 0.10 vs 0.11…），
# 上游不升我们改不动。以前一路 warn 的结果是 17 条固定噪声常年挂着，
# 真出问题时根本看不出来——license-exception-not-encountered 就是这么被埋掉的。
#
# 登记策略：每个 crate 保留**最新**版本，旧版本进 skip。依赖升级后旧版本消失，
# cargo-deny 会报「skip 条目未命中」，届时同步删掉对应行即可（这也是提醒）。
multiple-versions = "warn"
deny = []
skip = [
  # --- tauri / 加密栈 ---
  { name = "aes", version = "0.8.4" },
  { name = "block-buffer", version = "0.10.4" },
  { name = "cipher", version = "0.4.4" },
  { name = "cpufeatures", version = "0.2.17" },
  { name = "crypto-common", version = "0.1.7" },
  { name = "digest", version = "0.10.7" },
  { name = "inout", version = "0.1.4" },
  { name = "sha2", version = "0.10.9" },
  # --- 通用基础件（tauri 生态与 cargo 工具链各自钉版本）---
  { name = "base64", version = "0.21.7" },
  { name = "base64", version = "0.22.1" },
  { name = "getrandom", version = "0.2.17" },
  { name = "getrandom", version = "0.3.4" },
  { name = "hashbrown", version = "0.12.3" },
  { name = "indexmap", version = "1.9.3" },
  { name = "miniz_oxide", version = "0.8.9" },
  { name = "syn", version = "1.0.109" },
  { name = "syn", version = "2.0.119" },
  # --- 平台绑定 ---
  { name = "keyboard-types", version = "0.7.0" },
  { name = "windows-sys", version = "0.45.0" },
  { name = "windows-sys", version = "0.52.0" },
  { name = "windows-sys", version = "0.59.0" },
  # --- 压缩（zip → sherpa-onnx-sys 链路）---
  { name = "bzip2", version = "0.4.4" },
]

[sources]
# 只允许 crates.io，防止依赖被替换为任意 git/本地源。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
