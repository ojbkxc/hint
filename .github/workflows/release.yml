name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v1.1.18）；手动补发时填写"
        required: true
        type: string

permissions:
  contents: write

# 发布**不能**取消在跑的作业：里面含「创建 Release + 上传安装包」，
# 中途被杀会留下半个 Release（tag 已在、资产缺失），比慢更糟。
# 同一 tag 重复触发时串行排队即可。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    # 正常 12 分钟、冷缓存约 26 分钟。给「真挂住」兜底，不靠 GitHub 默认的 360 分钟。
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      # 与 build.yml 同理：缓存的 target 里若残留不完整的
      # sherpa-onnx-prebuilt/.../lib 目录，build.rs 会跳过下载并在链接时失败。
      - name: 清理 sherpa 预编译库缓存
        shell: pwsh
        run: |
          $removed = @()
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
            $removed += 'target/sherpa-onnx-prebuilt'
          }
          Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($sub in @('build', '.fingerprint')) {
              $dir = Join-Path $_.FullName $sub
              if (Test-Path $dir) {
                Get-ChildItem $dir -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item -Recurse -Force $_.FullName
                  $removed += $_.FullName
                }
              }
            }
          }
          if ($removed.Count -gt 0) {
            Write-Host ("已清理: " + ($removed -join ', '))
          } else {
            Write-Host "没有需要清理的 sherpa 缓存"
          }

      - name: 构建 Tauri 应用与 NSIS 安装包
        run: npm run tauri build

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: hint ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            hint 面试实时提词器（Windows 10/11 x64）

            ## 1.1.21 更新

            ### 修复：手动提问连发多个时只回答最后一个

            在浮层输入框连着问三个问题，以前**只有最后一个会被回答**，前面输入的全丢了，
            「排队 N」提示也从不出现。

            原因是手动提问照抄了「重新生成」的处理方式——先把积压的问题清空再入队。
            「重新生成」需要这个语义（不要旧的了，现在就要最新问题的答案），但手动提问只是
            **新增一个问题**，清空队列会把刚输入的问题一起丢掉。

            现在手输的问题和其它问题一样按顺序排队，浮层会正常显示「排队 N」。

            实测对比：

            ```
            修复前：问第三个问题 | pending=（空） | 历史 0 条
            修复后：问第二个问题 | pending=排队 1 | 历史 1 条
                    问第三个问题 | pending=（空） | 历史 2 条
            ```
          # 不用自动生成的 commit 列表：介绍只保留手写的最新版本内容，避免冗长。
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            target/release/hint.exe
            target/release/bundle/nsis/*.exe