name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v1.1.18）；手动补发时填写"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      # 与 build.yml 同理：缓存的 target 里若残留不完整的
      # sherpa-onnx-prebuilt/.../lib 目录，build.rs 会跳过下载并在链接时失败。
      - name: 清理 sherpa 预编译库缓存
        shell: pwsh
        run: |
          $removed = @()
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
            $removed += 'target/sherpa-onnx-prebuilt'
          }
          Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($sub in @('build', '.fingerprint')) {
              $dir = Join-Path $_.FullName $sub
              if (Test-Path $dir) {
                Get-ChildItem $dir -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item -Recurse -Force $_.FullName
                  $removed += $_.FullName
                }
              }
            }
          }
          if ($removed.Count -gt 0) {
            Write-Host ("已清理: " + ($removed -join ', '))
          } else {
            Write-Host "没有需要清理的 sherpa 缓存"
          }

      - name: 构建 Tauri 应用与 NSIS 安装包
        run: npm run tauri build

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: hint ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            hint 面试实时提词器（Windows 10/11 x64）

            ## 1.1.18 更新

            ### 改文案：界面上的「面试官」统一改为「提问」

            涉及的显示位置：

            - 浮层转录区的通道标签、会话复盘页的说话人标签、导出 Markdown 里的分段标签
            - 联合语音状态：「面试官在说」→「对方在说」（保持通顺）
            - 设置页说明与警告：「自动模式：对方说完一句话…」「系统输出（对方声音）」
            - 音频通道失败提示：「可能听不到对方」「将听不到对方的声音」

            改的只是**界面上看得到的文字**；发给模型的行为指令里仍用「面试官」描述角色，
            因为它不影响输出内容，改了对识别/回答没有收益。

            ### 说明

            这一版的发布说明只写当前版本，不再累积历史版本（旧版本的改动请查 CHANGELOG.md）。
          # 不用自动生成的 commit 列表：介绍只保留手写的最新版本内容，避免冗长。
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            target/release/hint.exe
            target/release/bundle/nsis/*.exe