name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v1.0.18）；手动补发时填写"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      # 与 build.yml 同理：缓存的 target 里若残留不完整的
      # sherpa-onnx-prebuilt/.../lib 目录，build.rs 会跳过下载并在链接时失败。
      - name: 清理 sherpa 预编译库缓存
        shell: pwsh
        run: |
          $removed = @()
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
            $removed += 'target/sherpa-onnx-prebuilt'
          }
          Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($sub in @('build', '.fingerprint')) {
              $dir = Join-Path $_.FullName $sub
              if (Test-Path $dir) {
                Get-ChildItem $dir -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item -Recurse -Force $_.FullName
                  $removed += $_.FullName
                }
              }
            }
          }
          if ($removed.Count -gt 0) {
            Write-Host ("已清理: " + ($removed -join ', '))
          } else {
            Write-Host "没有需要清理的 sherpa 缓存"
          }

      - name: 构建 Tauri 应用与 NSIS 安装包
        run: npm run tauri build

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: hint ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            hint 面试实时提词器（Windows 10/11 x64）

            ## 1.0.18 更新

            - **新增 `hint.exe --doctor` 自助诊断**：不启动界面，一次性体检并输出报告——版本、数据目录、语音模型是否就绪（含是否需要重新下载、旧目录是否残留）、协议与 API Key 是否已保存、Base URL 与模型名是否填写、会话数据库结构版本与完整性、可用的麦克风与系统输出设备、最近日志的 WARN/ERROR。有阻塞项逐条标 `[阻塞]` 并在末尾汇总。
            - 报告同时写入 `%APPDATA%\com.ojbkxc.hint\doctor-report.txt`（打包版无控制台也能拿到），反馈问题时连同 `hint.log` 一起附上即可。全程只读：不下载模型、不改配置、不写会话。
            - 为此把模型根路径规则拆成纯函数：诊断复用同一规则但不触发迁移副作用。

            ## 1.0.17 更新（历史）

            - 前端测试最后一块补完（`main.tsx` 窗口分发，7 例），总数 473、全部组件与入口覆盖；`recovered`（补录标记）补上 Rust 侧写读往返单测——此前该列在 Rust 侧零覆盖，V1 老行缺省回落 false 也有断言守住。
            - 文档与实际门禁对齐：SECURITY.md 增「依赖与供应链」四道门（audit / deny / clippy+fmt / 前端三件套），CONTRIBUTING.md 与 README.md 的本地检查清单补上 lint、test、fmt --check、clippy --all-targets、cargo deny。

            ## 1.0.16 更新（历史）

            - 供应链三级门禁：cargo-deny 上线（许可证白名单拒绝 GPL/AGPL 系列——守住「只借鉴 pluely 思路」的合规边界；依赖源锁定 crates.io 防替换；bans 重复版本监控），与既有 cargo-audit、clippy、rustfmt 共构成完整依赖质量门。
            - 截图选区组件三处健壮性：宿主缺 Pointer Capture API 时不再抛错打死选区；释放前能力检测；松开坐标改以 pointerup 为准（快速拖拽时此前会得到偏小的选区——真缺陷）。
            - 前端测试第四波 +83 用例（总数 466）：设置页 Dashboard 全分支（rail 导航与状态徽标、banner 定时消失、tab 切换、保存与日志目录）、截图选区四方向取框与边界。全前端组件测试覆盖完成，覆盖率 80.4% → 87%。
            - 双通道联合语音状态对后端枚举大小写容错；仓库 Rust 侧 license 元数据补齐（MIT）。

            ## 1.0.15 更新（历史）

            - 测试与工程质量版：前端测试第三波 +167 用例（总数 383，全部通过），整体覆盖率 16.7% → **80.4%**；设置域（模型接口、语音模型、简历资料、回答行为、设备、会话）与浮层（状态栏、根组件）全覆盖，包括保存/测试连接期间切协议的守卫、模型列表序号防过期响应、浮层 memo 渲染稳定性等回归点。
            - ESLint 归零：最后一个 `react-hooks/exhaustive-deps` 警告（设备卡片刷新闭包）修复，lint 现在 0 error 0 warning。
            - 1.0.12 的语音模型卸载保护已在真机完成端到端验收：卸载重装后日志无重新下载、`%LOCALAPPDATA%\hint-models` 迁移原子完成、数据库 V2 迁移（补录列）自动应用。

            ## 1.0.14 更新（历史）

            - 修复复盘页「补录」图例上线以来就没有数据：断线恢复补录的转录段落在写库时丢失补录标记（`segments` 表缺列）。本版自动迁移数据库补上 `recovered` 列，复盘页补录段落现在正确显示「补录」标签与左侧指示条。
            - 修复会话启动竞态吞错误态：启动命令返回时若后端已先发错误事件，错误状态会被覆盖回「正在启动」，只留文案不留状态；现在以先到为准。
            - 修复复盘列表时长兜底不可达：模型缺失的会话时长缺失时显示「时间未知」（旧代码该兜底永不触发，meta 只显示「模型未知」）。
            - **CSP 启用（最小集）**：脚本锁死 `self`、无 `unsafe-eval`；样式保留 `unsafe-inline` 供运行时进度/透明度内联样式；图片字体仅自源与 data:。
            - 前端测试第二波：新增 150 个用例（总数 216），覆盖浮层答案面板、转录面板、自动滚动、会话列表序号防回退、复盘页全分支、会话控制与模型管理状态机；整体覆盖率 16.7% → 50.7%。

            ## 1.0.13 更新（历史）

            - 修复 1.0.12 引入的 Anthropic 带图消息回归：连续同角色合并折叠时误删了「末条是 user 才并入」的角色检查，末条为 assistant 时消息被错误弹掉（CI 单测拦下，含图追问的请求体会少一条消息）。
            - 依赖安全升级：zip 2.6.1 → 9.7.0（RUSTSEC-2026-0367/0368，SUID/symlink 提权修复；与 sherpa-onnx 共用同一版本）、pdf-extract 0.9 → 0.12.1（带动 lopdf 0.36 → 0.42，深层嵌套 PDF 栈溢出修复）。cargo-audit 新门禁已清零。
            - CI 质量门全部转绿：rustfmt / clippy（-D warnings，hint-core、hint-audio、hint-stt、壳层共 17 处既有告警修掉：collapsible_if 折叠、needless_borrow、manual char comparison、is_multiple_of、as_chunks、type_complexity 等，行为全部等价）、ESLint、Vitest 66 用例。
            - 升级 1.0.12 后首次启动会看到日志出现「已迁移旧语音模型目录」，属正常现象。

            ## 1.0.12 更新（历史）

            - 修复卸载重装后语音模型被删、被迫重新下载 241 MB：Tauri NSIS 卸载器在勾选「删除应用数据」时会整目录删除 `%APPDATA%\<应用标识>`，模型原来就住在里面。现在语音模型存放在 `%LOCALAPPDATA%\hint-models`（不含应用标识，卸载器不触碰），从旧版本升级时已下载的模型会自动搬移过去，卸载重装不再丢失。
            - 修复浮层答案文字看起来发灰/半透明：浮层不透明度滑块只作用于白色背景，模型返回的答案正文改为显式实色并去掉光晕渗色，任何不透明度下正文都清晰。
            - 设置页按「模型管理」审美重构：左侧分组导航（接口与模型 / 会话 / 资料与行为 / 其他）+ 右侧单区块面板，导航条目实时显示状态徽标（Key 未保存、语音模型失败、会话未开始等），「保存全部配置」常驻面板底栏；760×560 最小窗口下无横向滚动。
            - 建立前端测试与 lint 体系：Vitest + Testing Library 66 个用例（覆盖清空后不复活、已答计数不封顶、排队数不抹零等回归点），ESLint flat config，CI 新增 vitest / eslint / clippy / fmt / audit / 覆盖率 6 道质量门。
            - 开源仓库配套：LICENSE（MIT）、SECURITY.md、CONTRIBUTING.md、CHANGELOG.md、.gitattributes（消除 CRLF 噪音）、.editorconfig、rust-toolchain.toml。

            ## 1.0.11 更新（历史）

            1.0.10 之后的三个文档修正，**二进制与 1.0.10 相同**（纯文案，无功能改动）：

            - 热键显示 / 隐藏浮层从 `Ctrl+Shift+Space` 改为 `Ctrl+Shift+H`（代码与 README、前端徽标、托盘 tooltip 早已同步，只有发布说明与两份设计文档还写着旧键，照着文档按会按错）。
            - 验收清单补充「浮层随面试自动显示 / 结束自动收起」用例。

            ## 1.0.10 更新（历史）

            - 修复麦克风缓冲欠载被当成通道失败：真机日志里 41 次 `buffer underrun or overrun` 每次都触发全量重建采集流，丢掉 0.3–2.3 秒音频并重置语音状态机，15 秒内 5 连失败直接把整场会话判死。现在瞬时欠载只记日志、不再重建流（流本身仍然存活），真正拔设备/路由失效仍按原路径重连。
            - 修复开始面试后浮层不自动显示：此前浮层默认隐藏，且没有任何自动显示路径，不按热键就看不到转录与电平。现在安装启动即显示浮层，开始面试时若浮层被隐藏也会自动弹出（你手动按 `Ctrl+Shift+H` 收起的话不会强行弹回）。
            - 修复取消模型下载被记成失败：日志按 ERROR 级打「语音资产准备失败，进度已重置」，而状态页显示「下载已取消」，两处口径互相矛盾。现在取消记 info 并保留已下载的 `.part`。
            - 模型接口卡片改为三段式协议切换（OpenAI 兼容 / Anthropic / Gemini），Base URL、模型名与 Key 按「预设 / 凭据」用细分隔线分组，设置页信息层级更清楚。

            ## 1.0.9 更新（历史）

            - 修复切换系统默认播放设备（插拔耳机 / 蓝牙闪断）被当成通道失败：此前 15 秒内切换 5 次就把系统声通道判死、再也听不到面试官；现在自动迁移到新设备，只提示一条警告并清零失败计数。
            - 修复系统声采集缓冲零余量导致的「偶发漏字」：loopback 缓冲从最小周期（约 10ms）放宽到 200ms，蓝牙 / USB 输出连播不再丢包。
            - 修复流式过程中点「清空」后答案整段复活：本轮剩余增量与最终全文不再上屏，直到下一轮开始。
            - 修复网关忽略 `stream: true` 直接回整包 JSON 时浮层停在空白答案：现在给出「模型接口没有返回任何文本（流式响应为空）」的中文错误。
            - 修复「重新生成 / 结束会话」在错误响应体读取阶段无法打断：非 2xx 响应体读取改为可取消，不再拖满 60 秒占住作答链路。
            - 修复识别侧的半句英文错误：WAV 格式不符、语言不支持等 8 类 `invalid input` 全部给中文说明，且不再连带丢弃健康 worker（避免每段音频重载 239 MB 模型）。
            - 修复模型就绪判定只比文件大小：现在要求记录里的 sha256 与清单一致，换模型或同大小换文件不会再被判成已安装。
            - 修复断点续传被 CDN 区间响应整份作废：206 响应只要求起点正确、终点不越界，下载进度得以保留；取消下载不必再等一次握手超时。
            - 修复托盘构建失败连带吞掉全局热键：托盘与热键解耦，主窗口关掉后 `Ctrl+Shift+H` 仍能取回浮层。
            - 修复界面卡顿：11 个在 UI 主线程做 SQLite / 凭据 / 配置 IO 的命令改到运行时线程；浮层答案与转录面板加 `memo`，30 fps 电平事件不再整棵树重渲染。
            - 修复「本场已答 N 题」到 11 题就不再增长；修复保存 / 测试连接期间切协议会把 Key 状态写到新协议头上。
            - 修复空问题触发无意义作答：「哪怕需求变了」「无论如何都要上线」「这个方案多少有点风险」不再被判成面试官提问，纯符号 / 纯标点的静音幻觉也不再入队。
            - 修复资料导入：DOCX 解压后的 `word/document.xml` 上限 32 MB，解压炸弹不再吃满内存。
            - 可访问性：转录面板可用键盘聚焦滚动，生成中状态与浮层提示可被读屏播报。
            - 其余：并发保存配置不再互踩临时文件；问答时间线 key 改用稳定序号；会话列表刷新加请求序号；错误提示不再出现「导出失败：导出失败：」这类双重前缀。

            ## 1.0.8 更新（历史）

            - 配置页与会话复盘页整体 UI 重构，参照 AIGX 设计语言：字号、间距、圆角、阴影、控件高度全部改为统一设计令牌。
            - 六张设置卡片统一「卡片头 + 卡体」结构；输入框、下拉、按钮、徽章、空状态、骨架屏样式全面统一。
            - 状态反馈按语义分色：成功绿、警告黄、错误红、信息蓝，修复此前失败提示与成功提示同色的问题。
            - 可访问性改进：所有按钮键盘聚焦时显示焦点环，「设置 / 会话复盘」补齐标签页读屏关系，动态提示可被读屏播报。
            - 复盘页新增转录图例（面试官 / 我 / 回声 / 补录），并统一空状态、加载与错误提示的视觉。
            - 浮层外观与 320x180 / 320x240 紧凑布局保持不变，纯界面改动、功能行为无变化。

            ## 功能概述

            - 双通道本地语音识别：麦克风（我）+ 系统声（面试官），区分两路说话人并过滤扬声器回声。
            - 三种大模型协议流式作答：OpenAI 兼容（DeepSeek / OpenAI / 通义 / 智谱 / Ollama 等）、Anthropic Messages、Gemini。
            - 连续多问队列：新问题自动排队逐个回答，浮层显示当前问题与排队数量；答案区为连续时间线，可回看更早的问答。
            - 会话保存与复盘：转录和问答落本地 SQLite，结束后可在「会话复盘」导出 Markdown。
            - 所有资料、会话与音频处理都在本机完成，API Key 存入 Windows 凭据管理器。

            ## 安装方式

            1. 下载下方附件中的 NSIS 安装包（形如 `hint_1.0.18_x64-setup.exe`）并运行，按向导完成安装（当前用户安装，无需管理员权限）。
            2. 启动 hint，在设置页选择协议、填写 Base URL 与模型名、粘贴 API Key，点「测试连接」确认可用后点底部「保存全部配置」。
            3. 热键：`Ctrl+Shift+H` 显示/隐藏浮层，`Ctrl+Shift+R` 开始/结束面试，`Ctrl+Shift+A` 对最新问题重新生成，`Ctrl+Shift+S` 截图问答（尚未启用），`Esc` 隐藏浮层。

            ## 首次使用需下载模型

            语音模型不在安装包内，首次使用前需在设置页「语音模型」卡片下载约 241 MB（241,357,257 字节）的本地识别模型，支持断点续传与 sha256 校验。下载完成后才能开始面试。

            ## 系统要求

            - Windows 10 / Windows 11，x64。
            - 需要可用的麦克风与系统播放设备；建议佩戴耳机，避免回声影响识别。
            - 首次编译/运行依赖系统 WebView2（Windows 10 较新版本与 Windows 11 通常已内置）。

            ## 已知限制

            - 截图问答尚未启用（M5 预留）。
            - 未启用 CSP。
            - 无自动更新，需要手动下载新版本覆盖安装。
            - 仅支持 Windows。
            - 待答问题队列最多 5 个；简历与项目资料各 6000 字上限。
            - 个人知识库尚未支持，当前仅注入简历与项目资料。
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/release/hint.exe
            target/release/bundle/nsis/*.exe