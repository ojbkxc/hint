name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v1.1.5）；手动补发时填写"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      # 与 build.yml 同理：缓存的 target 里若残留不完整的
      # sherpa-onnx-prebuilt/.../lib 目录，build.rs 会跳过下载并在链接时失败。
      - name: 清理 sherpa 预编译库缓存
        shell: pwsh
        run: |
          $removed = @()
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
            $removed += 'target/sherpa-onnx-prebuilt'
          }
          Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($sub in @('build', '.fingerprint')) {
              $dir = Join-Path $_.FullName $sub
              if (Test-Path $dir) {
                Get-ChildItem $dir -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item -Recurse -Force $_.FullName
                  $removed += $_.FullName
                }
              }
            }
          }
          if ($removed.Count -gt 0) {
            Write-Host ("已清理: " + ($removed -join ', '))
          } else {
            Write-Host "没有需要清理的 sherpa 缓存"
          }

      - name: 构建 Tauri 应用与 NSIS 安装包
        run: npm run tauri build

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: hint ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            hint 面试实时提词器（Windows 10/11 x64）

            ## 1.1.5 更新

            ### 新增：设置页「环境自检」

            「保存与日志 → 环境自检」点一下，直接看到本地诊断：版本、语音模型状态与安装位置、配置（协议/Key/Base URL/模型名/字号/内容保护/代理）、会话数据库、音频设备、日志尾部的告警。

            以前只有命令行 `--doctor` 能跑，但排查问题的人往往就是你自己（设备不对、模型没下、配置被清空）——让你去命令行敲参数不现实。

            屏幕上看到的和命令行报告**逐字一致**（共用同一份诊断逻辑，不维护第二份判据）。遇到问题时把这段贴出来就够定位了。

            ## 1.1.4 更新（历史）

            ### 改进：浮层里直接打字提问

            按 `Ctrl+Shift+H` 摊开浮层，底部多了一行输入框——直接打字按回车，答案流式出现，**全程不经过语音识别**，也不用切到主窗口。

            上一版的手动提问在设置页里。面试时你盯的是浮层，切窗口打字会打断注意力、也可能被面试官看到，那个入口能用但不好用。

            两个细节：
            - 打字打到一半按 `Esc` 只清空输入，不会把浮层关掉（否则白输一遍）
            - 提交后光标留在输入框，方便连着问

            ## 1.1.3 更新（历史）

            ### 新增：手动提问（识别不准时的兜底）

            设置页「面试会话 → 手动提问」：把问题直接打进去回车，答案照样流式出现在浮层。

            **为什么需要它**：面试作答原本只能由语音识别出的问题驱动。一旦识别不准（设备、噪声、口音都可能），你就完全没有办法让产品产出答案——而这个产品的全部价值就是给出答案。模型链路本身是好的（实测首字 2.5 秒、正常返回），坏的可能只是识别那一环，不该被它拖死。

            实测：输入「请用一句话说明什么是软件测试」→ 2 秒内浮层出现答案，全程不经过语音识别。

            ### 顺带

            - CI 的依赖检查不再刷 18 条固定噪声（1 条失效的许可证例外 + 17 条重复版本），已知可接受的重复已显式登记，新出现的会立刻显形。

            ## 1.1.2 更新（历史）

            ### 修复：移除「语音识别语言」设置（实测无效）

            1.1.0/1.1.1 加的那个下拉框是**假功能**，本版移除。

            实测：同一段中文音频，把语言强制成 `auto` / `zh` / `en` / `ja` / `ko` / `yue`，输出**逐字相同**；强制日语/韩语也照样输出中文，强制中文也照样输出英文。**SenseVoice 自己判语言，这个参数几乎被忽略。**

            所以「切到英文会改善英文识别」不成立，那个下拉框只会误导你；1.1.1 里「默认固定中文」对中文乱码问题也**没有任何作用**——那是我基于推断做的修复，没有实测支撑，这里更正。

            设置项已移除；配置文件里的旧值原样保留（不影响使用）。

            ### 顺带改进（音频链路可诊断）

            - 系统声采集优先使用设备原生格式，并请求 Windows 的 RAW 流开关以绕开音效处理；两者都被拒绝时自动回退，不会让「系统声」通道连不上。
            - 启动日志现在写明实际协商到的格式与 RAW 状态，例如 `格式=设备混音格式，RAW=已绕开音效`。排查「听不到面试官」「识别不准」时可直接看出走的是哪条路径。

            ## 1.1.1 更新（历史）

            ### 修复：1.1.0 的黑框修复对已装过的用户不生效

            1.1.0 把「共享屏幕时隐藏浮层」的默认值改成了关闭，但**改默认值只对字段缺失的配置生效**——1.0.26 首次保存时已经把 `true` 写进了配置文件，所以老用户升级后打开还是黑框。真机验证时抓到的就是这个（升级后启动日志仍是 `protected=true`）。

            本版加了一次性配置迁移：升级时自动把你配置里那个 `true` 改回 `false`，并把「语音识别语言」里遗留的 `auto` 拉回 `zh`。迁移只跑一次，之后你自己手动打开的保护不会被再动。

            顺带修掉一个连带问题：前端保存配置时会漏掉版本号，导致每次保存后迁移被重复触发、把你手动打开的保护强行关掉。现在版本号原样透传。

            ## 1.1.0 更新（历史）

            ### 修复：共享屏幕时浮层变成黑框

            - **1.0.26 的「浮层不进屏幕捕获」默认开，实测害大于利，本版改为默认关。** 同一台机器上按三条捕获路径实测同一个窗口：GDI 抓屏下能正确排除；`PrintWindow`（腾讯会议等共享屏幕走的正是这类路径）下变成**纯黑块**——也就是你看到的黑框，反而等于告诉对方「我在用工具」；旧式 `PrintWindow` 则**完全绕过保护、内容原样可见**。
            - 需要这个能力时仍可在设置页打开，但请先在本地开一次屏幕共享自测。**更稳的做法：面试前按 `Ctrl+Shift+H` 直接隐藏浮层。**

            ### 语音识别：尝试修中文乱码（**该修复已证实无效，见 1.1.2**）

            - 原先固定让模型自己判语言（`auto`），中文口语里夹几个英文单词时容易判成日文/韩文，整句输出成乱码（对照实测：英文一句不差、中文全乱）。
            - 新增「语音识别语言」，**默认固定中文**：SenseVoice 的中文模式对中英混说有训练覆盖，夹的英文词也能正常识别。纯英文会议可切「英文」，也可切回「自动判别」（UI 里已注明中文场景不建议）。
            - 实时识别与断线补录共用同一份语言设置——两处口径不一致会让同一段话前后识别结果不同。

            ### 新增：截图问答（Ctrl+Shift+S）

            - 按 `Ctrl+Shift+S` 打开全屏选区，拖拽框住屏幕上任意区域（题目、代码、图表），松开即把选区发给模型，答案流式出现在浮层里单独的一块区域，和面试答案分区显示、互不覆盖。
            - 选区支持任意拖动方向；Esc、右键均可取消；误触产生过小选区（小于 8×8 像素）会直接提示重新框选，不会白发一次请求。
            - 需要模型支持视觉输入（看图）。单边超过 4096 像素会明确报错并在提示里给出实际尺寸，不静默缩图。
            - 生成超过 60 秒按「已中断」处理，已输出的内容保留；面板上的关闭按钮会中断后端正在跑的截图问答。

            ### 隐私边界

            - 截图只在内存里编码，**不写磁盘**；日志只记宽高、编码后字节数与耗时，**不含图像数据**。
            - 只发往你自己在设置页填的模型接口，不发任何第三方。
            - 截图问答**不进**面试转录、待答队列、会话历史与本地数据库。
            - 没有后台截屏，也没有全屏轮询：只有你按下热键并框选之后才抓一次。

            ## 1.0.26 更新（历史）

            ### 面试时不泄露（腾讯会议 / 钉钉 / 飞书 / OBS）

            - 浮层不进屏幕捕获（**该默认值已在 1.1.0 改为关闭**，原因见 1.1.0 的黑框修复说明）：底层 Windows `WDA_EXCLUDEFROMCAPTURE` 的效果取决于对方的抓屏方式，实测在 `PrintWindow` 类捕获下会显示成黑块、旧式捕获则完全拦不住。

            ### 代理

            - 新增「出网代理」三档：**直连**（默认）/ **跟随系统**（读 Windows「Internet 选项」里代理软件写的设置）/ **手动指定**（如 `http://127.0.0.1:7890`）。装 Clash / v2rayN 等代理软件连不上模型时用它。
            - 模型接口与语音模型下载都走同一份代理设置；**本机回环（浮层通信、语音识别）永不走代理**。选直连时会显式忽略 `HTTP(S)_PROXY` 环境变量，避免"我设了直连却还被改道"。

            ### 浮层

            - 字号上限从 160% 提到 **300%**；两个滑块改成紧凑布局，字号不再被底部栏挡住（之前要滚到底才看得见）。
            - 底部显示**配置的模型名**，不再因为还没答过题就显示「未连接模型」（那文案会让人以为接口没连上）。

            ## 1.0.25 更新（历史）

            - 修复同一条状态提示在设置页显示两次（底部固定栏与「模型接口」卡片各渲染一遍），现在统一只在底部保存栏显示。
            - 修复「保存失败：保存配置失败：…」双重前缀，改为原样透传后端消息。
            - 1.0.24 的保存守卫已通过真机验收：把 Base URL 清空后点保存会被明确拒绝（提示点名缺失字段并说明会覆盖已有配置），配置文件内容保持不变。

            ## 1.0.24 更新（历史）

            - **保存配置时拒绝空的 Base URL / 模型名**：这是 1.0.23 修复根因后的最后一道保险——即使表单因为任何原因变成空值，点「保存全部配置」也不会再把空内容写进配置文件覆盖你已填好的设置，而是明确提示「Base URL 为空，保存会覆盖已填好的配置，请先填写再保存」。
            - 校验逻辑放在 `hint-core` 并由 4 条单测守护（只空 Base URL / 只空模型名 / 两者都空 / 字段齐全放行），进 CI 门禁。

            ## 1.0.23 更新（历史）

            - **修复「配置被清空」的真因**：`AppState` 原先在 `.setup()` 里注册，而 setup 在窗口与 webview 建好之后才执行，前端首屏的 IPC 请求因此撞上「state not managed」直接失败，设置页表单停在空值，点保存就把空的 Base URL / 模型名写回配置文件。现在状态在 Builder 阶段（窗口创建之前）注册，任何窗口 IPC 都不可能更早到达。**若你之前配置被清空，本版已修复，重新填写保存一次即可。**
            - 数据目录改按 `%APPDATA%\<identifier>` 在 Builder 阶段推导，并在 setup 里与 Tauri 官方结果比对，不一致会记日志暴露。

            ## 1.0.22 更新（历史）

            - **修复「配置存不住」的真因**：Tauri 的 IPC 注入脚本与前端 JS 并行加载，首屏读配置时偶尔还没就绪，旧代码直接判定「不在 Tauri 环境」→ 请求根本不到后端 → 设置页表单停在空值，此时点「保存全部配置」就把空的 Base URL / 模型名写回文件，覆盖掉真实配置。现在等待注入完成（最多 1.5 秒）再调用，纯浏览器预览行为不变。**若你之前遇到过配置被清空，本版已修复，重新填写保存一次即可。**
            - **浮层字号可调**：「回答行为」页新增「浮层字号」滑块（80%–160%，默认 100%），答案、转录与问题行一起缩放；保存后浮层立即生效，不用重开。
            - **「Ctrl+Shift+H 显示浮层」做成可点按钮**：点一下即切换浮层显示 / 隐藏（与热键同一条命令），按钮文案随状态在「显示浮层 / 隐藏浮层」之间切换。
            - 设置保存与读取都会写日志（协议、Base URL 与模型名是否填写、字号），配置出问题时可直接从日志判断。

            ## 1.0.21 更新（历史）

            - **修复「模型老是重新下载」的隐患**：清单读取原先要求 `version` 字段严格等于当前常量，否则整份判为无效。这意味着以后任何一次清单版本 bump（哪怕只加字段）都会让所有用户重下 241 MB。现在兼容性交给结构解析判断，文件是否可信仍由 sha256 + 大小二次校验兜底。
            - **配置保存现在有日志**：此前保存成功与失败都不写日志，用户反馈「配置存不住」时无从判断。现在失败记 error（含路径），成功记 info（协议、Base URL 与模型名是否填写、不透明度；不记录内容以免泄露自建网关信息）；读取时也记一条，用于区分「没写成」与「写成了但被回落成默认」。
            - **`--doctor` 在全新机器上写不出报告**：写文件前没有创建数据目录，而全新安装 / 卸载重装后该目录本就不存在——恰恰是最需要诊断的时候。已补 `create_dir_all`。
            - CI 新增 `--doctor` 冒烟测试：构建后真实运行一次并断言报告 7 个分节齐全、版本三重对齐、日志缺失不被误报为读取失败。这条门禁本轮就抓出了上述「全新机器写不出报告」的问题。

            ## 1.0.20 更新（历史）

            - **修复 `--doctor` 的控制台输出从未生效**（真机跑 1.0.19 才发现）：`hint.exe --doctor` 在 cmd / PowerShell 下 stdout 恒为空，只有报告文件。原因是程序为 Windows GUI 子系统，启动时无控制台、stdout 句柄无效——原先只附加了控制台，却没把 stdout 重绑过去。现在用 `CreateFileW("CONOUT$")` + `SetStdHandle` 重新绑定输出与错误流。**实测：cmd 下 stdout 从 0 行变为 45 行。** PowerShell 因不等待 GUI 进程仍看不到输出（属 PowerShell 行为），README 已写明改用读取报告文件。
            - 报告去掉「模型根目录」与「安装位置」重复打同一路径的冗余。
            - 旧模型目录提示改为区分两种情形：仍有数据时报体积并提示确认新位置可用后再删；只剩空壳（迁移成功的正常残留）则直接说可安全删除。真机上它此前只给一句含糊的「若非残留可手动删除」。

            ## 1.0.19 更新（历史）

            - `--doctor` 的报告逻辑变得可测并修掉一个真缺陷：日志级别判定原先用 `" WARN "` 子串匹配，正文以 WARN 开头的 INFO 行会被误算成告警。现在按 tracing 的字段格式精确解析级别（时间戳后第二个 token）。
            - 把 `--doctor` 的纯逻辑（日志尾部筛选、设备标签、字节格式化）下沉到 `hint-core::diagnostics`——壳层的 `cargo test -p hint` 因 sherpa 静态库不可用，放那里等于没人守。新增 6 个单测进 CI 门禁（含正文误命中、窗口裁剪、160 字截断、15 条上限、空输入）。

            ## 1.0.18 更新（历史）

            - **新增 `hint.exe --doctor` 自助诊断**：不启动界面，一次性体检并输出报告——版本、数据目录、语音模型是否就绪（含是否需要重新下载、旧目录是否残留）、协议与 API Key 是否已保存、Base URL 与模型名是否填写、会话数据库结构版本与完整性、可用的麦克风与系统输出设备、最近日志的 WARN/ERROR。有阻塞项逐条标 `[阻塞]` 并在末尾汇总。
            - 报告同时写入 `%APPDATA%\com.ojbkxc.hint\doctor-report.txt`（打包版无控制台也能拿到），反馈问题时连同 `hint.log` 一起附上即可。全程只读：不下载模型、不改配置、不写会话。
            - 为此把模型根路径规则拆成纯函数：诊断复用同一规则但不触发迁移副作用。

            ## 1.0.17 更新（历史）

            - 前端测试最后一块补完（`main.tsx` 窗口分发，7 例），总数 473、全部组件与入口覆盖；`recovered`（补录标记）补上 Rust 侧写读往返单测——此前该列在 Rust 侧零覆盖，V1 老行缺省回落 false 也有断言守住。
            - 文档与实际门禁对齐：SECURITY.md 增「依赖与供应链」四道门（audit / deny / clippy+fmt / 前端三件套），CONTRIBUTING.md 与 README.md 的本地检查清单补上 lint、test、fmt --check、clippy --all-targets、cargo deny。

            ## 1.0.16 更新（历史）

            - 供应链三级门禁：cargo-deny 上线（许可证白名单拒绝 GPL/AGPL 系列——守住「只借鉴 pluely 思路」的合规边界；依赖源锁定 crates.io 防替换；bans 重复版本监控），与既有 cargo-audit、clippy、rustfmt 共构成完整依赖质量门。
