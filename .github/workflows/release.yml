name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v1.1.18）；手动补发时填写"
        required: true
        type: string

permissions:
  contents: write

# 发布**不能**取消在跑的作业：里面含「创建 Release + 上传安装包」，
# 中途被杀会留下半个 Release（tag 已在、资产缺失），比慢更糟。
# 同一 tag 重复触发时串行排队即可。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    # 正常 12 分钟、冷缓存约 26 分钟。给「真挂住」兜底，不靠 GitHub 默认的 360 分钟。
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 发布说明从 CHANGELOG.md 抽当前 tag 的小节，不再写在 workflow 里。
      # 手写版的毛病有实数：v1.1.20、v1.1.21 两次发版，workflow 里的正文标题
      # 都还停在「## 1.1.19 更新」——写死的内容没人记得跟着版本改。
      # 抽不到就叫它失败，而且放在构建之前：宁可 5 秒就红，
      # 也不要构建完 6 分钟才发一份版本号对不上的说明。
      - name: 生成发布说明（从 CHANGELOG.md 抽当前版本小节）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          $lines = @(Get-Content CHANGELOG.md -Encoding UTF8)
          $head = '^##\s*\[' + [regex]::Escape($version) + '\]'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $head) { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md 里没有 [$version] 小节（tag=$tag），先补更新日志再发版" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s*\[') { $end = $i; break }
          }
          $section = ($lines[$start..($end - 1)] -join "`n").TrimEnd()
          $header = "hint 面试实时提词器（Windows 10/11 x64）`n`n"
          $footer = "`n`n完整更新日志见 [CHANGELOG.md](https://github.com/ojbkxc/hint/blob/main/CHANGELOG.md)。"
          $text = $header + $section + $footer
          $out = Join-Path $PWD '.release-notes.md'
          [System.IO.File]::WriteAllText($out, $text, (New-Object System.Text.UTF8Encoding $false))
          $size = (Get-Item $out).Length
          Write-Host "已生成发布说明：版本 $version，$size bytes"
          if ($size -lt 100) { throw "发布说明过短（$size bytes），抽取可能失败" }

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      # 与 build.yml 同理：缓存的 target 里若残留不完整的
      # sherpa-onnx-prebuilt/.../lib 目录，build.rs 会跳过下载并在链接时失败。
      - name: 清理 sherpa 预编译库缓存
        shell: pwsh
        run: |
          $removed = @()
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
            $removed += 'target/sherpa-onnx-prebuilt'
          }
          Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($sub in @('build', '.fingerprint')) {
              $dir = Join-Path $_.FullName $sub
              if (Test-Path $dir) {
                Get-ChildItem $dir -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item -Recurse -Force $_.FullName
                  $removed += $_.FullName
                }
              }
            }
          }
          if ($removed.Count -gt 0) {
            Write-Host ("已清理: " + ($removed -join ', '))
          } else {
            Write-Host "没有需要清理的 sherpa 缓存"
          }

      - name: 构建 Tauri 应用与 NSIS 安装包
        run: npm run tauri build

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: hint ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .release-notes.md
          # 不用自动生成的 commit 列表：正文是 CHANGELOG 里当前版本的小节，已经够详细。
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            target/release/hint.exe
            target/release/bundle/nsis/*.exe