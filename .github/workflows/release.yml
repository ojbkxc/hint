name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v1.1.18）；手动补发时填写"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      # 与 build.yml 同理：缓存的 target 里若残留不完整的
      # sherpa-onnx-prebuilt/.../lib 目录，build.rs 会跳过下载并在链接时失败。
      - name: 清理 sherpa 预编译库缓存
        shell: pwsh
        run: |
          $removed = @()
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
            $removed += 'target/sherpa-onnx-prebuilt'
          }
          Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($sub in @('build', '.fingerprint')) {
              $dir = Join-Path $_.FullName $sub
              if (Test-Path $dir) {
                Get-ChildItem $dir -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item -Recurse -Force $_.FullName
                  $removed += $_.FullName
                }
              }
            }
          }
          if ($removed.Count -gt 0) {
            Write-Host ("已清理: " + ($removed -join ', '))
          } else {
            Write-Host "没有需要清理的 sherpa 缓存"
          }

      - name: 构建 Tauri 应用与 NSIS 安装包
        run: npm run tauri build

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: hint ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            hint 面试实时提词器（Windows 10/11 x64）

            ## 1.1.19 更新

            ### 修复：导出 Markdown 之前其实没存下文件

            会话复盘的「导出 Markdown」原来走浏览器下载。真机验证发现：下载事件在系统层面
            走完了（`completed`），界面也提示「已导出」，但文件在**用户下载目录、AppData、
            Temp 里全都不存在**——以为存好了，回头找不到。

            现在改成：点导出先弹**保存对话框**让你选位置，然后由程序直接写盘。成功就是成功，
            失败会告诉你原因，取消就什么都不做。

            ### 顺带

            清掉两条随之不再使用的下载工具函数。
          # 不用自动生成的 commit 列表：介绍只保留手写的最新版本内容，避免冗长。
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            target/release/hint.exe
            target/release/bundle/nsis/*.exe