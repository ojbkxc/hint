name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 前端检查与核心库编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 前端生产构建
        run: npm run build

      - name: 核心库检查
        run: cargo check --locked -p hint-core -p hint-store -p hint-audio

      - name: 核心库测试
        run: cargo test --locked -p hint-core -p hint-store -p hint-audio

      - name: 语音平台无关部分检查
        run: cargo check --locked -p hint-stt --no-default-features

      - name: 语音平台无关部分测试
        run: cargo test --locked -p hint-stt --no-default-features

      - name: 语音推理引擎编译（sherpa-onnx 预编译库，需联网）
        run: cargo check --locked -p hint-stt

      - name: Tauri 集成编译检查
        run: cargo check --locked -p hint --bins

  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      # sherpa-onnx-sys 的 build.rs 只要看到 target/sherpa-onnx-prebuilt/.../lib
      # 目录存在就跳过下载；缓存的构建目录若来自一次中断的构建，这里会残留
      # 不完整的目录，导致链接阶段报 "could not find native static library
      # sherpa-onnx-c-api"。同时清掉 build/fingerprint 产物，强制 build.rs
      # 重新运行并下载完整静态库（其余 crate 的缓存保持不变）。
      - name: 清理 sherpa 预编译库缓存
        shell: pwsh
        run: |
          $removed = @()
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
            $removed += 'target/sherpa-onnx-prebuilt'
          }
          Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($sub in @('build', '.fingerprint')) {
              $dir = Join-Path $_.FullName $sub
              if (Test-Path $dir) {
                Get-ChildItem $dir -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item -Recurse -Force $_.FullName
                  $removed += $_.FullName
                }
              }
            }
          }
          if ($removed.Count -gt 0) {
            Write-Host ("已清理: " + ($removed -join ', '))
          } else {
            Write-Host "没有需要清理的 sherpa 缓存"
          }

      - name: 构建 Tauri 应用
        run: npm run tauri build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hint-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/hint.exe
            target/release/bundle/nsis/*.exe
