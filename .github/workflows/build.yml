name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：这个工作流只读仓库（检出代码、上传 artifact）。
# 不写的话吃的是仓库默认的 GITHUB_TOKEN 权限，新仓库默认就能 push，
# 一旦某一步（比如某个第三方 action）被投毒，就有写代码的余地。
# release.yml 因为要建 Release，单独声明了 contents: write。
permissions:
  contents: read

# 同一分支 / 同一 PR 只保留最新一次运行。
# 连续 push 时取消上一次还在跑的作业：windows-latest 正常 11~15 分钟，
# 连推三次就会堆三个作业互相抢并发额度，界面上表现为「一直在排队 / 编译卡住」。
# pull_request 事件按 PR 号分组，不同 PR 之间不会互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 前端检查与核心库编译
    runs-on: windows-latest
    # 正常 11 分钟、冷缓存约 26 分钟。上限不是性能设置，是给「真挂住」兜底：
    # 不设的话作业要挂到 GitHub 默认的 360 分钟才会被杀，那才是真正的卡死。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 前端单元测试（Vitest）
        run: npm run test

      - name: 前端生产构建
        run: npm run build

      - name: Rust 格式检查（rustfmt）
        run: cargo fmt --all -- --check

      - name: 核心库检查
        run: cargo check --locked -p hint-core -p hint-store -p hint-audio

      - name: Clippy（核心库）
        run: cargo clippy --locked -p hint-core -p hint-store -p hint-audio --all-targets -- -D warnings

      - name: 核心库测试
        run: cargo test --locked -p hint-core -p hint-store -p hint-audio

      - name: 语音平台无关部分检查
        run: cargo check --locked -p hint-stt --no-default-features

      - name: 语音平台无关部分测试
        run: cargo test --locked -p hint-stt --no-default-features

      - name: 语音推理引擎编译（sherpa-onnx 预编译库，需联网）
        # build.rs 要联网下载预编译静态库。单独设上限：网络卡住时让它尽快失败
        # 重跑，而不是把整个作业挂到总超时、让排队中的其它运行一直等着。
        timeout-minutes: 20
        run: cargo check --locked -p hint-stt

      - name: Clippy（语音与壳层）
        run: cargo clippy --locked -p hint-stt -p hint --bins -- -D warnings

      - name: Tauri 集成编译检查
        run: cargo check --locked -p hint --bins

      # 两个审计工具改成下载上游自己发布的 Windows 预编译二进制。
      # 原来 `cargo install cargo-deny --locked` 每次现场编译，实测这一步 3.4 分钟，
      # 占测试作业 11 分钟里的 31%；而且编译要先从 crates.io 取依赖，那段网络一旦
      # 卡住，界面上就是「这一步一直不结束」。预编译版约 5 秒。
      # 下载源仍是上游 Release（rustsec/rustsec、EmbarkStudios/cargo-deny），
      # 与 cargo install 同源同版本，不引入第三方重新构建的产物。
      - name: 安装审计工具（cargo-audit / cargo-deny）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: 依赖安全审计（cargo-audit）
        run: |
          # RUSTSEC-2026-0592 (url) / 0594 (cookie)：tauri/wry 生态整体锁定的传递依赖。
          # url 的利用面是 Url::origin() 解析恶意 blob: URL（hint 不解析不可信 URL）；
          # cookie 的利用面是 fork 后 nonce 重复（hint 是桌面进程，不做 cookie 服务器）。
          # 升级 tauri 大版本才能带动，跟进修踪（见 docs/review.md）。
          cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0592 --ignore RUSTSEC-2026-0594

      - name: 许可证与依赖源检查（cargo-deny）
        run: cargo deny --workspace check licenses bans sources
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    needs: test
    # 正常 15 分钟、冷缓存约 26 分钟（Tauri 全量链接最重）。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      # sherpa-onnx-sys 的 build.rs 只要看到 target/sherpa-onnx-prebuilt/.../lib
      # 目录存在就跳过下载；缓存的构建目录若来自一次中断的构建，这里会残留
      # 不完整的目录，导致链接阶段报 "could not find native static library
      # sherpa-onnx-c-api"。同时清掉 build/fingerprint 产物，强制 build.rs
      # 重新运行并下载完整静态库（其余 crate 的缓存保持不变）。
      - name: 清理 sherpa 预编译库缓存
        shell: pwsh
        run: |
          $removed = @()
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
            $removed += 'target/sherpa-onnx-prebuilt'
          }
          Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($sub in @('build', '.fingerprint')) {
              $dir = Join-Path $_.FullName $sub
              if (Test-Path $dir) {
                Get-ChildItem $dir -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item -Recurse -Force $_.FullName
                  $removed += $_.FullName
                }
              }
            }
          }
          if ($removed.Count -gt 0) {
            Write-Host ("已清理: " + ($removed -join ', '))
          } else {
            Write-Host "没有需要清理的 sherpa 缓存"
          }

      - name: 构建 Tauri 应用
        run: npm run tauri build

      # 冒烟测试：真的把构建出来的 exe 跑一次 `--doctor`。
      #
      # 为什么必须放在 CI：1.0.19 的 `--doctor` 编译过、clippy 过、单测过，
      # 真机一跑 stdout 却是空的（GUI 子系统下没重绑句柄）。只验证「能编译」
      # 会漏掉这类「功能整体不生效」的缺陷。这里直接断言报告文件非空、
      # 且包含应有的分节，等于每次 CI 都替用户跑一遍。
      - name: 冒烟测试 --doctor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "target/release/hint.exe"
          if (-not (Test-Path $exe)) { throw "构建产物缺失：$exe" }
          # PowerShell 不会把裸相对名当可执行文件（与 cmd 不同），
          # 且对 GUI 子系统程序用 `&` 调用**不等待**、$LASTEXITCODE 为 null。
          # 必须用 Start-Process -Wait -PassThru 才能拿到真实退出码。
          $exePath = (Resolve-Path $exe).Path
          Write-Host "== 运行 $exePath --doctor =="
          $proc = Start-Process -FilePath $exePath -ArgumentList '--doctor' -PassThru -Wait
          $code = $proc.ExitCode
          Write-Host "exit=$code"
          $report = Join-Path $env:APPDATA "com.ojbkxc.hint\doctor-report.txt"
          if (-not (Test-Path $report)) { throw "报告文件未生成：$report" }
          $size = (Get-Item $report).Length
          Write-Host "报告大小：$size bytes"
          if ($size -lt 200) { throw "报告内容过短（$size bytes），诊断可能提前中断" }
          $text = Get-Content $report -Raw -Encoding UTF8
          # 分节必须齐全——少一节说明某段探测 panic 或提前返回了。
          $required = @("hint 诊断报告", "【语音模型】", "【配置】", "【会话数据库】", "【音频设备】", "【最近日志】", "结论：")
          foreach ($marker in $required) {
            if ($text -notlike "*$marker*") { throw "报告缺少分节：$marker" }
          }
          # 全新 runner 上没有日志文件，必须报「尚无日志文件」而不是「读取失败」。
          if ($text -like "*读取失败*") { throw "日志缺失被误报成读取失败（应提示『尚无日志文件』）" }
          # 版本三重对齐：package.json / exe 文件版本 / 报告里写的版本。
          # CI 里三者来自同一 commit 必然一致；任一不一致说明版本号有地方漏改，
          # 或者报告没读 CARGO_PKG_VERSION 而是硬编码。
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $exeVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "package.json=$version  exe=$exeVersion"
          if ($exeVersion -ne $version) { throw "exe 文件版本($exeVersion)与 package.json($version) 不一致" }
          if ($text -notlike "*版本：$version*") { throw "报告版本与 package.json($version) 不一致" }
          # 复制到工作区，供 artifact 上传（uploads 只认工作区内路径，
          # 也避免依赖 runner 的具体用户名）。
          New-Item -ItemType Directory -Force -Path "ci-artifacts" | Out-Null
          Copy-Item $report "ci-artifacts/doctor-report.txt" -Force
          Write-Host "== --doctor 冒烟通过（版本 $version，$size bytes，7 个分节齐全）=="

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hint-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/hint.exe
            target/release/bundle/nsis/*.exe
            ci-artifacts/doctor-report.txt
