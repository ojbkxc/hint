name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 前端检查与核心库编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 核心库检查
        run: cargo check -p hint-core

  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        run: npm run tauri build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hint-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/hint.exe
            target/release/bundle/nsis/*.exe
