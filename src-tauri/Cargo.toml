[package]
name = "hint"
version = "1.1.87"
description = "hint · 面试实时提词器"
license = "MIT"
authors = ["ojbkxc"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
hint-core = { path = "../crates/hint-core" }
hint-audio = { path = "../crates/hint-audio" }
hint-stt = { path = "../crates/hint-stt" }
hint-store = { path = "../crates/hint-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pdf-extract = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 只用于「浮层周期性重新置顶」：tao 的 `set_always_on_top(true)` 在窗口已经是
# TOPMOST 时是**空操作**（`apply_diff` 里 diff 为空直接 return），没法把被别的
# 置顶窗口压下去的浮层重新拉回顶层，必须自己调 `SetWindowPos`。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
