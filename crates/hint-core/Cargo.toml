[package]
name = "hint-core"
version = "0.1.0"
edition = "2024"
description = "hint 的核心业务逻辑：配置、凭证、LLM 调用"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
keyring = "4"
thiserror = "2"
