[package]
name = "hint-core"
version = "1.0.6"
edition = "2024"
description = "hint 的核心业务逻辑：配置、凭证、LLM 调用"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
keyring = "4"
thiserror = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
encoding_rs = "0.8"
